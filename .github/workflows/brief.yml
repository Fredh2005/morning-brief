name: Build the morning brief

# GitHub's scheduler is best-effort. It routinely starts crons an hour or more
# late on this account, and on 26-27 Aug 2026 it dropped roughly 44 hours of
# firings across every repo here - no runs, no failures, just silence, and two
# weekday briefs never appeared.
#
# So this workflow no longer depends on any single firing. Several crons fire
# through the morning and each run asks one question: has the live site already
# published today? If it has, the run stops at the guard. If it has not, it
# builds. A dropped cron therefore costs a later brief, not a missing one.
#
# The guard reads the wall clock, which the previous design deliberately did
# not. The distinction matters: the old guard asked "which cron slot am I in?",
# which a delayed run answers WRONGLY and then skips the real firing while
# reporting success. This one asks "what is today's date in the UK, and has
# today's brief been published yet?" - a question a delayed run still answers
# correctly. That also removes the BST/GMT cron pairing entirely.
on:
  schedule:
    - cron: "3 4 * * 1-5"    # 05:03 UK in BST - the on-time slot
    - cron: "13 5 * * 1-5"   # 05:13 UK in GMT - the on-time slot
    - cron: "23 6 * * 1-5"   # catch-up
    - cron: "33 7 * * 1-5"   # catch-up
    - cron: "43 8 * * 1-5"   # catch-up
  workflow_dispatch:         # manual "Run workflow" button, always proceeds

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - id: check
        env:
          SITE: https://fredh2005.github.io/morning-brief/
        run: |
          set -uo pipefail

          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual run - proceeding."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NOW=$(date +%s)
          TODAY=$(TZ=Europe/London date +%F)
          DOW=$(TZ=Europe/London date +%u)
          echo "UK now: $(TZ=Europe/London date '+%F %H:%M %Z')  (today=$TODAY dow=$DOW)"

          # Cron day-of-week is UTC; the brief's weekdays are UK weekdays.
          if [ "$DOW" -gt 5 ]; then
            echo "Weekend in the UK - no brief today."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Never publish early: in GMT the first slot lands at 04:03 UK.
          TARGET=$(TZ=Europe/London date -d "$TODAY 05:00" +%s)
          if [ "$NOW" -lt "$TARGET" ]; then
            echo "Before 05:00 UK - too early. A later slot will pick this up."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          LM=$(curl -sSI --max-time 30 "$SITE" | tr -d '\r' \
               | awk -F': ' 'tolower($1)=="last-modified"{print $2}') || LM=""
          if [ -z "$LM" ]; then
            echo "No Last-Modified from $SITE - building rather than risk a missed day."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PUB_DATE=$(TZ=Europe/London date -d "$LM" +%F) || PUB_DATE=""
          echo "Live site last published: $LM (UK date ${PUB_DATE:-unparsed})"
          if [ "$PUB_DATE" = "$TODAY" ]; then
            echo "Today's brief is already up - nothing to do."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Today's brief is not up yet - building."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --quiet -r requirements.txt

      - name: Show what actually got installed
        # The first run failed because CI resolved newer libraries than this
        # code had ever run against. Print them, so a future break is one glance
        # rather than another round of guessing.
        run: |
          python -c "import sys, pandas, yfinance; print('python', sys.version.split()[0]); print('pandas', pandas.__version__); print('yfinance', yfinance.__version__)"
          python -c "from zoneinfo import ZoneInfo; from datetime import datetime; print('London time:', datetime.now(ZoneInfo('Europe/London')))"

      - name: Build the brief
        run: python -W ignore build.py

      - name: Fail if the page came back thin
        run: |
          # A brief that renders but says nothing is worse than a visible red X.
          BYTES=$(wc -c < site/index.html)
          echo "index.html is $BYTES bytes"
          if [ "$BYTES" -lt 4000 ]; then
            echo "::error::index.html is only $BYTES bytes - not publishing."
            exit 1
          fi
          for f in manifest.webmanifest sw.js icon-192.png apple-touch-icon.png; do
            [ -s "site/$f" ] || { echo "::error::site/$f missing or empty"; exit 1; }
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
