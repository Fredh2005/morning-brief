name: Keep scheduled builds alive

# GitHub disables scheduled workflows in a public repo after 60 days without a
# commit. Nothing here needs editing once it works, so the repo would go quiet,
# the morning build would stop, and the page would freeze with no obvious sign.
# One trivial commit a month resets that clock.
on:
  schedule:
    - cron: "23 3 1 * *"    # 03:23 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

jobs:
  touch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Record the heartbeat
        run: |
          mkdir -p .github
          echo "Last automated activity: $(date -u '+%Y-%m-%d %H:%M UTC')" \
            > .github/last-active.txt
          echo "" >> .github/last-active.txt
          echo "This file exists only to keep the repository active so GitHub" \
            >> .github/last-active.txt
          echo "does not disable the morning build. Nothing reads it." \
            >> .github/last-active.txt

      - name: Commit if anything changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/last-active.txt
          git diff --staged --quiet || git commit -m "Monthly heartbeat to keep the schedule alive"
          git push
